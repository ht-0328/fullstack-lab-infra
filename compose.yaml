# インフラの道具（AWS CLI と Terraform）。docker compose run --rm tools で中のシェルに入って使う。
services:
  tools:
    build: .
    # ホストのユーザーで動かし、.terraform/ などの所有者を root にしない
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      AWS_REGION: ap-northeast-1
    volumes:
      # aws login の設定と期限つきの認証情報。AWS CLI が更新して書き戻すので読み書きできる形で渡す
      - ${HOME}/.aws:/home/infra/.aws
      - .:/work
    stdin_open: true
    tty: true
